services:
  specimen-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: specimen-checkin-db
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data:
    driver: local
